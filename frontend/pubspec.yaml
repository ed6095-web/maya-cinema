name: maya_app
description: MAYA — Personal Movie Streaming Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # HTTP client
  dio: ^5.4.3+1

  # Secure storage (JWT token)
  flutter_secure_storage: ^9.0.0

  # Video player
  video_player: ^2.8.6

  # Image caching
  cached_network_image: ^3.3.1

  # Google Fonts (Inter)
  google_fonts: ^6.2.1

  # Icons
  lucide_icons: ^0.257.0

  # Shimmer / skeleton loading
  shimmer: ^3.0.0

  # File picker (for upload)
  file_picker: ^8.0.3

  # Image picker (for poster)
  image_picker: ^1.1.2

  # HTTP multipart (used by Dio)
  http_parser: ^4.0.2

  # Shared preferences (non-sensitive settings)
  shared_preferences: ^2.2.3

  # Percent indicator (progress bars)
  percent_indicator: ^4.2.3

  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
