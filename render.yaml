services:
  - type: web
    name: maya-cinema
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: APP_NAME
        value: MAYA
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./maya.db
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: maya-media
      mountPath: /app/backend/media
      sizeGB: 1
